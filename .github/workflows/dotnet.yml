name: .NET CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies (log captured)
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet restore GiftOfTheGivers.sln 2>&1 | tee restore.log

      - name: Restore diagnostics
        if: always()
        run: |
          grep -E ": error" restore.log | while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Restore diagnostics"
            echo '```'
            grep -E ": error" restore.log | head -30 || echo "(no restore errors)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build solution (log captured)
        id: build
        continue-on-error: true
        run: dotnet build GiftOfTheGivers.sln --configuration Release --no-restore 2>&1 | tee build.log

      - name: Build diagnostics
        if: always()
        run: |
          grep -E ": error " build.log | while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Build diagnostics"
            echo '```'
            grep -E ": error " build.log | head -40 || echo "(no compile errors)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job if restore or build failed
        if: always()
        run: |
          if [ "${{ steps.restore.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            exit 1
          fi

      - name: Run tests (log captured)
        id: test
        continue-on-error: true
        run: dotnet test GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj --configuration Release --no-build --verbosity normal 2>&1 | tee test.log

      - name: Test diagnostics
        if: always()
        run: |
          grep -A6 "^  Failed " test.log | while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Test diagnostics"
            echo '```'
            grep -B2 -A10 "^  Failed " test.log | head -80 || echo "(no failed tests)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job if tests failed
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "failure" ]; then exit 1; fi


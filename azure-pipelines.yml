# Azure Pipelines - Continuous Integration for the Gift of the Givers solution.
#
# CI best practices demonstrated here:
#   - CI trigger on all branches + PR validation on main
#   - Reusable build template (templates/dotnet-build.yml)
#   - Variables for configuration, secret variable group for sensitive values
#   - Build, test and package steps kept in one reusable job
#
# Secrets management (see docs/AZURE-SETUP.md - "Pipeline secrets"):
#   Store the Azure SQL connection string and other sensitive values in a
#   variable group named "gotg-secrets" (Pipelines -> Library -> Variable group),
#   then uncomment the group line below. Secret values are injected at run time
#   and are masked in the logs.

trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - main

# variables:
#   - group: gotg-secrets        # uncomment after creating the variable group

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'

stages:
  - stage: Build
    displayName: 'Build, Test & Pack'
    jobs:
      - template: templates/dotnet-build.yml
        parameters:
          buildConfiguration: $(buildConfiguration)
          dotnetVersion: $(dotnetVersion)

